<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link href="../media/style.css" rel="stylesheet" />
<style>
  body { --vscode-editor-background:#1f2335; --vscode-foreground:#c0caf5;
         --vscode-editor-foreground:#c0caf5; --vscode-font-family: system-ui, sans-serif;
         --vscode-editor-font-family: "DejaVu Sans Mono", monospace; --vscode-font-size:13px;
         --vscode-editor-font-size:12.5px; --vscode-descriptionForeground:#7f88b0;
         --vscode-editorWidget-background:#1a1b26; --vscode-input-background:#16161e;
         --vscode-input-foreground:#c0caf5; --vscode-textCodeBlock-background:#16161e;
         --vscode-focusBorder:#7aa2f7; --vscode-textLink-foreground:#7aa2f7; }
</style>
<title>Code Trail preview</title>
</head>
<body>
<div id="toolbar">
  <button id="btn-expand">⤢ 전체 펼치기</button>
  <button id="btn-collapse">⤡ 전체 접기</button>
  <button id="btn-order">⇅ 코드 순서</button>
  <span class="sep"></span>
  <input id="filter" type="search" placeholder="이름/경로 필터…" />
  <span class="sep"></span>
  <button id="btn-md">Markdown</button>
  <button id="btn-save">저장</button>
  <button id="btn-load">불러오기</button>
  <button id="btn-clear" class="danger">지우기</button>
</div>
<div id="breadcrumb"></div>
<div id="root"></div>
<div id="empty">
  <h2>Code Trail</h2>
  <p>에디터에서 함수 위에 커서를 놓고 <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>T</kbd> 를 누르면 여기에 코드가 펼쳐진다.</p>
  <ul>
    <li>코드 안의 <b>식별자를 클릭</b>하면 그 정의가 자식 노드로 붙는다.</li>
    <li><kbd>Alt</kbd>+클릭 = 구현(implementation) 찾기.</li>
    <li><kbd>Ctrl</kbd>+클릭 = 실제 에디터에서 열기.</li>
  </ul>
</div>
<div id="toast"></div>
<script>
  window.__posted = [];
  window.acquireVsCodeApi = function () {
    return { postMessage: function (m) { window.__posted.push(m); } };
  };
</script>
<script src="../media/tokenizer.js"></script>
<script src="../media/main.js"></script>
</body>
</html>
